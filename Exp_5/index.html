<!DOCTYPE html>
<html lang="en">

<head>
    <title>To-Do List</title>
</head>

<body style="text-align: center;">
    <h2>To-Do List</h2>
    <label>Task:</label>
    <input type="text" id="taskInput" placeholder="Enter a task">
    <button onclick="addTask()">Add Task</button>
    <br><br>
    <table border="1" align="center">
        <thead>
            <tr>
                <th>Sr. No.</th>
                <th>Task</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody id="taskList">
        </tbody>
    </table>
    <script src="app.js"></script>
</body>

</html>
